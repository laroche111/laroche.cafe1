<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Laroche Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D2E22;
    --surface:#123727;
    --surface-2:#1A4433;
    --border:#2C5A44;
    --text:#F3EEDD;
    --muted:#9FBBA9;
    --gold:#C9A24E;
    --gold-soft:#E4CE93;
    --pending:#E0954A;
    --done:#5FAE95;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body.lang-ar{font-family:'Tajawal','Inter',system-ui,sans-serif;}
  h1,h2,.serif{font-family:'Fraunces',serif;}
  body.lang-ar h1, body.lang-ar h2, body.lang-ar .serif{font-family:'Tajawal','Fraunces',serif;}

  /* decorative pattern layer */
  #pattern{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    opacity:0.15;
  }

  .app{
    position:relative;z-index:1;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:8px;
  }
  .lang-switch{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .lang-switch button{
    border:none;background:transparent;color:var(--muted);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:999px;cursor:pointer;
    letter-spacing:.02em;
  }
  .lang-switch button.active{background:var(--gold);color:#1a2b1f;}

  .brand{
    text-align:center;
    margin:18px 0 34px;
  }
  .medallion{
    width:78px;height:78px;margin:0 auto 14px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--gold);
    box-shadow:inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .medallion span{
    font-family:'Fraunces',serif;
    font-size:34px;
    color:var(--gold);
    font-weight:500;
  }
  .brand-name{font-size:26px;font-weight:500;margin:0 0 4px;letter-spacing:.01em;}
  .tagline{font-size:13px;color:var(--muted);margin:0;letter-spacing:.02em;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
  }

  .heading{font-size:20px;font-weight:500;margin:0 0 6px;text-align:center;}
  .subtext{font-size:14px;color:var(--muted);text-align:center;margin:0 0 22px;line-height:1.5;}

  .table-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
  }
  .table-grid a{
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    font-family:'Fraunces',serif;
    font-size:17px;
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .table-grid a:active{background:var(--gold);color:#1a2b1f;border-color:var(--gold);}

  .pill{
    display:inline-block;
    margin:0 auto 16px;
    padding:6px 16px;
    background:var(--surface-2);
    border:1px solid var(--gold);
    color:var(--gold-soft);
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
  }
  .pill-wrap{text-align:center;}

  .actions{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;
    padding:15px 18px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;font-weight:600;
    cursor:pointer;
    text-decoration:none;
    transition:transform .1s ease, opacity .15s ease;
  }
  body.lang-ar .btn{font-family:'Tajawal',sans-serif;}
  .btn:active{transform:scale(0.98);}
  .btn.primary{
    background:var(--gold);
    border-color:var(--gold);
    color:#1a2b1f;
  }
  .btn.primary:disabled{
    background:var(--surface-2);
    border-color:var(--border);
    color:var(--muted);
    cursor:default;
    transform:none;
  }
  .btn svg{width:18px;height:18px;flex-shrink:0;}

  .confirm-line{
    text-align:center;
    font-size:12.5px;
    color:var(--done);
    margin-top:10px;
    min-height:16px;
  }

  .footer{
    margin-top:auto;
    padding-top:32px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  .back-link{
    display:inline-block;
    margin-bottom:14px;
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
  }

  [dir="rtl"] .lang-switch{direction:ltr;}
</style>
</head>
<body>

<svg id="pattern" xmlns="http://www.w3.org/2000/svg"></svg>

<div class="app" id="app"></div>

<script src="config.js"></script>
<script>
/* ---------- storage helpers ----------
   - personal/device data (language choice, per-table call cooldown) -> localStorage
   - shared data (the actual waiter call) -> the backend API, via fetch
*/
const API_BASE = window.LAROCHE_API_BASE || '';

function localGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function localSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){}
}

async function apiCreateCall(table_number){
  if(!API_BASE){ console.warn('LAROCHE_API_BASE is not set in config.js'); return null; }
  try{
    const res = await fetch(`${API_BASE}/api/calls`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ table_number })
    });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.error('apiCreateCall failed', e); return null; }
}

/* ---------- i18n ---------- */
const DICT = {
  tr:{
    pickHeading:"Masanızı seçin",
    pickSub:"Devam etmek için masa numaranıza dokunun",
    welcomeHeading:"Hoş geldiniz",
    welcomeSub:"Size nasıl yardımcı olabiliriz?",
    table:"Masa",
    menu:"Menüyü Görüntüle",
    instagram:"Instagram'da Takip Et",
    call:"Garson Çağır",
    called:"Çağrıldı ✓",
    calledLine:(t)=>`Garson çağrıldı — ${t}'de bildirildi`,
    footer:(n)=>`Laroche Cafe · Masa ${n}`,
    back:"← Masaları göster",
    tagline:"Lüks Lounge & Cafe"
  },
  ar:{
    pickHeading:"اختر طاولتك",
    pickSub:"اضغط على رقم طاولتك للمتابعة",
    welcomeHeading:"أهلاً بكم",
    welcomeSub:"كيف يمكننا خدمتكم؟",
    table:"طاولة",
    menu:"عرض القائمة",
    instagram:"تابعنا على إنستغرام",
    call:"استدعاء النادل",
    called:"تم الاستدعاء ✓",
    calledLine:(t)=>`تم استدعاء النادل — الساعة ${t}`,
    footer:(n)=>`لاروش كافيه · طاولة ${n}`,
    back:"← عرض الطاولات",
    tagline:"لاونج وكافيه فاخر"
  },
  en:{
    pickHeading:"Select your table",
    pickSub:"Tap your table number to continue",
    welcomeHeading:"Welcome",
    welcomeSub:"How can we help you today?",
    table:"Table",
    menu:"View Menu",
    instagram:"Follow on Instagram",
    call:"Call Waiter",
    called:"Called ✓",
    calledLine:(t)=>`Waiter called — notified at ${t}`,
    footer:(n)=>`Laroche Cafe · Table ${n}`,
    back:"← Back to tables",
    tagline:"Luxury Lounge & Cafe"
  }
};

let currentLang = 'tr';
const LANG_STORAGE_KEY = 'laroche-customer-lang';

function t(key, ...args){
  const v = DICT[currentLang][key];
  return typeof v === 'function' ? v(...args) : v;
}

/* ---------- decorative background pattern ---------- */
function buildPattern(){
  const svg = document.getElementById('pattern');
  const icons = [
    // milkshake
    `<g>
      <path d="M-8 4 L8 4 L6 26 Q7 30 0 30 Q-7 30 -6 26 Z" fill="none" stroke="#C9A24E" stroke-width="1.2"/>
      <line x1="-9" y1="4" x2="9" y2="4" stroke="#C9A24E" stroke-width="1.2"/>
      <line x1="3" y1="-6" x2="7" y2="4" stroke="#C9A24E" stroke-width="1.2"/>
      <circle cx="3" cy="-8" r="1.4" fill="#C9A24E"/>
    </g>`,
    // cookie
    `<g>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#C9A24E" stroke-width="1.2"/>
      <circle cx="-4" cy="-3" r="1.3" fill="#C9A24E"/>
      <circle cx="4" cy="-4" r="1.3" fill="#C9A24E"/>
      <circle cx="1" cy="4" r="1.3" fill="#C9A24E"/>
      <circle cx="-5" cy="4" r="1.3" fill="#C9A24E"/>
    </g>`,
    // shisha
    `<g>
      <ellipse cx="0" cy="14" rx="9" ry="12" fill="none" stroke="#C9A24E" stroke-width="1.2"/>
      <rect x="-2.5" y="-8" width="5" height="16" fill="none" stroke="#C9A24E" stroke-width="1.1"/>
      <path d="M-2.5 -8 Q -14 -10 -14 2" fill="none" stroke="#C9A24E" stroke-width="1.1"/>
      <circle cx="0" cy="-11" r="3" fill="none" stroke="#C9A24E" stroke-width="1.1"/>
    </g>`
  ];
  let defs = `<defs><pattern id="tile" width="140" height="140" patternUnits="userSpaceOnUse">`;
  const positions = [[24,30],[95,20],[60,90],[110,110],[20,115]];
  positions.forEach((p,i)=>{
    defs += `<g transform="translate(${p[0]},${p[1]}) scale(1.1)">${icons[i%icons.length]}</g>`;
  });
  defs += `</pattern></defs>`;
  svg.innerHTML = defs + `<rect width="100%" height="100%" fill="url(#tile)"/>`;
}
buildPattern();

/* ---------- routing ---------- */
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const m = h.match(/^table\/(\d{1,2})$/);
  if(m){
    const n = parseInt(m[1], 10);
    if(n >= 1 && n <= 25) return {view:'table', n};
  }
  return {view:'picker'};
}

function applyDirLang(){
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-ar', currentLang === 'ar');
}

function langSwitchHTML(){
  const langs = [['tr','TR'],['ar','AR'],['en','EN']];
  return `<div class="lang-switch">${langs.map(([code,label])=>
    `<button data-lang="${code}" class="${code===currentLang?'active':''}">${label}</button>`
  ).join('')}</div>`;
}

function bindLangSwitch(render){
  document.querySelectorAll('.lang-switch button').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      currentLang = btn.dataset.lang;
      localSet(LANG_STORAGE_KEY, currentLang);
      applyDirLang();
      render();
    });
  });
}

/* ---------- views ---------- */
function renderPicker(){
  applyDirLang();
  const app = document.getElementById('app');
  let grid = '';
  for(let i=1;i<=25;i++){
    grid += `<a href="#/table/${i}">${i}</a>`;
  }
  app.innerHTML = `
    <div class="topbar">${langSwitchHTML()}</div>
    <div class="brand">
      <div class="medallion"><span>L</span></div>
      <h1 class="brand-name">Laroche Cafe</h1>
      <p class="tagline">${t('tagline')}</p>
    </div>
    <div class="card">
      <h2 class="heading">${t('pickHeading')}</h2>
      <p class="subtext">${t('pickSub')}</p>
      <div class="table-grid">${grid}</div>
    </div>
    <div class="footer">Laroche Cafe · 2014</div>
  `;
  bindLangSwitch(renderPicker);
}

const CALLED_ICON = `<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const BELL_ICON = `<svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;

async function renderTable(n){
  applyDirLang();
  const app = document.getElementById('app');
  const cooldownKey = `cooldown-table-${n}`;
  const lastCallAt = localGet(cooldownKey);
  const now = Date.now();
  const cooldownMs = 30000;
  let remaining = 0;
  if(lastCallAt){
    const elapsed = now - Number(lastCallAt);
    if(elapsed < cooldownMs) remaining = cooldownMs - elapsed;
  }

  app.innerHTML = `
    <div class="topbar">${langSwitchHTML()}</div>
    <a class="back-link" href="#/">${t('back')}</a>
    <div class="brand" style="margin-top:0;">
      <div class="medallion"><span>L</span></div>
      <h1 class="brand-name">Laroche Cafe</h1>
      <p class="tagline">${t('tagline')}</p>
    </div>
    <div class="pill-wrap"><span class="pill">${t('table')} ${n}</span></div>
    <div class="card">
      <h2 class="heading">${t('welcomeHeading')}</h2>
      <p class="subtext">${t('welcomeSub')}</p>
      <div class="actions">
        <a class="btn" href="https://owlmenu.net/laroche/" target="_blank" rel="noopener">${t('menu')}</a>
        <a class="btn" href="https://www.instagram.com/laroche.cafe/" target="_blank" rel="noopener">${t('instagram')}</a>
        <button class="btn primary" id="callBtn">${BELL_ICON}<span id="callLabel"></span></button>
      </div>
      <p class="confirm-line" id="confirmLine"></p>
    </div>
    <div class="footer">${t('footer', n)}</div>
  `;
  bindLangSwitch(()=>renderTable(n));

  const callBtn = document.getElementById('callBtn');
  const callLabel = document.getElementById('callLabel');
  const confirmLine = document.getElementById('confirmLine');
  let timerId = null;

  function fmtTime(ms){
    return new Date(ms).toLocaleTimeString(currentLang === 'ar' ? 'ar' : currentLang === 'tr' ? 'tr-TR' : 'en-GB', {hour:'2-digit', minute:'2-digit'});
  }

  function setDisabled(msRemaining, calledAtMs){
    callBtn.disabled = true;
    callLabel.textContent = t('called');
    if(calledAtMs) confirmLine.textContent = t('calledLine', fmtTime(calledAtMs));
    let left = msRemaining;
    clearInterval(timerId);
    timerId = setInterval(()=>{
      left -= 1000;
      if(left <= 0){
        clearInterval(timerId);
        callBtn.disabled = false;
        callLabel.textContent = t('call');
      }
    }, 1000);
  }

  if(remaining > 0){
    setDisabled(remaining, Number(lastCallAt));
  } else {
    callLabel.textContent = t('call');
  }

  callBtn.addEventListener('click', async ()=>{
    if(callBtn.disabled) return;
    const callTime = Date.now();
    localSet(cooldownKey, String(callTime));

    // send the call to the backend API
    const created = await apiCreateCall(n);
    const effectiveTime = created ? created.called_at : callTime;

    setDisabled(cooldownMs, effectiveTime);
  });
}

/* ---------- boot ---------- */
async function render(){
  const route = parseRoute();
  if(route.view === 'table'){
    await renderTable(route.n);
  } else {
    renderPicker();
  }
}

(async function init(){
  const savedLang = localGet(LANG_STORAGE_KEY);
  if(savedLang && DICT[savedLang]) currentLang = savedLang;
  await render();
})();

window.addEventListener('hashchange', render);
</script>
</body>
</html>
